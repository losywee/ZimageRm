[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zinvis"
version = "0.2.0"
description = "Remove invisible AI image watermarks by diffusion regeneration with Z-Image Turbo and Chroma1"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
diffusion = ["torch>=2.0", "diffusers>=0.36", "transformers>=4.51", "accelerate>=0.20", "safetensors>=0.4", "huggingface_hub>=0.20", "diffsynth>=2.0.17,<3"]
zimage = ["torch>=2.0", "diffsynth>=2.0.17,<3", "transformers>=4.51", "accelerate>=0.20", "safetensors>=0.4", "huggingface_hub>=0.20", "gguf>=0.10"]

[project.scripts]
zinvis = "zinvis.cli:main"
